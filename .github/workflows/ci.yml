name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --check
      - if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test
      - run: node --test
      - if: matrix.os == 'ubuntu-latest'
        name: Homebrew formula renders
        run: |
          mkdir -p /tmp/f
          for t in aarch64-apple-darwin x86_64-apple-darwin aarch64-unknown-linux-musl x86_64-unknown-linux-musl; do echo "0000  x" > /tmp/f/crewii-v0.0.0-$t.tar.gz.sha256; done
          sh scripts/formula.sh v0.0.0 /tmp/f > /tmp/f/crewii.rb
          ruby -c /tmp/f/crewii.rb
          grep -c 'sha256 "0000"' /tmp/f/crewii.rb | grep -qx 4

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2
        with:
          tool: cargo-llvm-cov
      - run: rustup component add llvm-tools-preview
      - run: sh scripts/coverage.sh

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.85
      - run: cargo check --locked --all-targets

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - run: cargo build --all-targets --locked
